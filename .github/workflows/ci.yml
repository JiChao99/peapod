name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check landing page assets
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          import { dirname, resolve } from 'node:path';
          import vm from 'node:vm';

          const root = process.cwd();
          const html = readFileSync(resolve(root, 'index.html'), 'utf8');
          const css = readFileSync(resolve(root, 'site/assets/site.css'), 'utf8');
          if (html.includes('data:image')) throw new Error('Landing page embeds image data');
          if (!existsSync(resolve(root, '.nojekyll'))) throw new Error('Missing .nojekyll');
          if (!/\.product-frame\s*>\s*img\s*\{[^}]*object-fit:\s*contain/s.test(css)) {
            throw new Error('Product screenshot must use object-fit: contain');
          }
          const preview = readFileSync(resolve(root, 'site/assets/app-preview.png'));
          if (preview.readUInt32BE(16) !== 1920 || preview.readUInt32BE(20) !== 1032) {
            throw new Error('Product screenshot must remain 1920×1032');
          }
          if (!/aspect-ratio:\s*80\s*\/\s*43/.test(css)) throw new Error('Product screenshot ratio must match its pixels');
          const refs = [
            ...[...html.matchAll(/(?:src|href)=["']([^"']+)["']/g)].map((m) => ({ ref: m[1], base: root })),
            ...[...css.matchAll(/url\(["']?([^"')]+)["']?\)/g)].map((m) => ({ ref: m[1], base: dirname(resolve(root, 'site/assets/site.css')) })),
          ].filter(({ ref }) => ref && !/^(?:https?:|mailto:|tel:|#|\/\/)/.test(ref));
          for (const { ref, base } of refs) {
            const path = resolve(base, ref.replace(/^\.\//, '').replace(/^\//, ''));
            if (!existsSync(path)) throw new Error(`Missing landing page asset: ${ref}`);
          }

          const siteJS = readFileSync(resolve(root, 'site/assets/site.js'), 'utf8');
          const boundary = siteJS.indexOf('const supportedLanguages');
          if (boundary < 0) throw new Error('Landing page translations boundary not found');
          const context = vm.createContext({});
          vm.runInContext(siteJS.slice(0, boundary) + '\nglobalThis.translations = translations;', context);
          const dictionaries = context.translations;
          const englishKeys = Object.keys(dictionaries.en).sort();
          for (const lang of ['zh', 'zh-TW', 'ja']) {
            const keys = Object.keys(dictionaries[lang]).sort();
            const missing = englishKeys.filter(key => !keys.includes(key));
            const extra = keys.filter(key => !englishKeys.includes(key));
            if (missing.length || extra.length) {
              throw new Error(`${lang} translation keys: missing=${missing.join(',')} extra=${extra.join(',')}`);
            }
          }
          const decodeEntities = value => value
            .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
            .replace(/&quot;/g, '"').replace(/&#39;/g, "'");
          const normalize = value => decodeEntities(value).replace(/\s+/g, ' ').trim();
          for (const match of html.matchAll(/<(p|span|h2|h3|strong)\b[^>]*\bdata-i18n="([^"]+)"[^>]*>([^<]+)<\/\1>/g)) {
            const [, , key, text] = match;
            if (dictionaries.en[key] && normalize(text) !== normalize(dictionaries.en[key])) {
              throw new Error(`Landing page default text differs from en translation: ${key}`);
            }
          }
          console.log(`landing assets and translations ok (${refs.length} refs, ${englishKeys.length} keys)`);
          NODE